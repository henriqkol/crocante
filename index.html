<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crocante</title>
  <meta name="description" content="Cardápio, compras por semana e orçamento da casa">
  <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0B0B0C">
  <script>/* tema escolhido neste aparelho (Casa → Aparência), aplicado antes de pintar a tela */
    try { var t = localStorage.getItem("tema"); if (t === "claro" || t === "escuro") { document.documentElement.dataset.theme = t === "claro" ? "light" : "dark";
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "claro" ? "#F4F3EF" : "#0B0B0C"; }); } } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/doto-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="app"><div class="carregando-tela"><div class="spinner" role="status" aria-label="Carregando"></div></div></div>

    <a href="#compras" data-aba="compras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h3l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>COMPRAS</a>
    <a href="#geladeira" data-aba="geladeira"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="1"/><path d="M5 9.5h14M8.5 5v2.5M8.5 12.5v4"/></svg>GELADEIRA</a>
