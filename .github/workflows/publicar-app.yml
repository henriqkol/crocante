name: Publicar app

# Copia a pasta app/ para o ramo gh-pages, que o GitHub Pages publica.
on:
  push:
    branches: [main]
    paths: ["app/**", "privacidade.html", ".github/workflows/publicar-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nova versão do cache (celulares pegam a atualização)
        run: |
          sed -i -E "s/crocante-v[0-9]+/crocante-${GITHUB_SHA::8}/" app/sw.js
          # o app compara PUBLICACAO com versao.txt para se atualizar sozinho
          sed -i -E "s/PUBLICACAO = \"local\"/PUBLICACAO = \"${GITHUB_SHA::8}\"/" app/config.js
          echo "${GITHUB_SHA::8}" > app/versao.txt
          grep -q "${GITHUB_SHA::8}" app/config.js
      - name: Publica no ramo gh-pages
        run: |
          cp privacidade.html app/privacidade.html   # política de privacidade (exigida pelo Google)
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publicação ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
